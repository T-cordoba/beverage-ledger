# Supply-chain hardening. See CLAUDE.md §3.
#
# No dependency is allowed to run install scripts. unrs-resolver asks for one,
# but it ships prebuilt platform binaries as optional dependencies and its script
# is only a build-from-source fallback, so lint, typecheck and build all pass
# without it. Listing it as ignored records that the decision was made
# deliberately instead of leaving a warning on every install.
onlyBuiltDependencies: []

ignoredBuiltDependencies:
  - unrs-resolver

# Refuse packages published less than 24h ago. Compromised versions are usually
# detected and unpublished within hours, so this is what stops a freshly
# published malicious release from landing here. It only affects resolution —
# adding or bumping a dependency — not installs from the existing lockfile.
minimumReleaseAge: 1440

# Patched versions of vulnerable transitive dependencies, all of them advisories
# against dev tooling that upstream has not bumped yet.
#
# Written by hand rather than by `pnpm audit --fix`, which emits one entry per
# advisory: overlapping selectors, and replacements like '>=1.1.16' that resolve
# to the highest version on the registry and would silently cross a major. Each
# entry below pins one major line with a caret, and the tree carries two lines
# of brace-expansion, minimatch and picomatch, hence the pairs.
#
# brace-expansion deliberately stops at 1.1.16 / 2.1.3 even though GHSA-mh99-
# v99m-4gvg is only marked fixed in >=5.0.8. In 5.x the CommonJS export became a
# namespace object, and minimatch calls the module as a function, so forcing it
# makes both minimatch 3 and 9 throw on any pattern containing braces. Worse,
# eslint still exits clean, so nothing would surface it until a brace pattern hit
# that path. Two advisories stay open here; see CLAUDE.md §3.
overrides:
  ajv@6: ^6.14.0
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.3
  flatted@3: ^3.4.2
  glob@10: ^10.5.0
  js-yaml@4: ^4.3.0
  minimatch@3: ^3.1.4
  minimatch@9: ^9.0.7
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss@8: ^8.5.18
  yaml@2: ^2.8.3
  # 0.x, so this is a breaking-change boundary by convention and it belongs to
  # next, not to us. Verified: sharp still loads and the build is unaffected.
  sharp@<0.35.0: ^0.35.0
