# CI infrastructure: Jenkins and SonarQube, as described in CLAUDE.md.
#
# The network is external so that the containers the pipeline itself starts
# (beverage-ledger-api, beverage-ledger-front) can join it and be reached by
# name from inside Jenkins:
#
#   docker network create devops-net

name: beverage-ledger-devops

services:
  jenkins:
    build: ./jenkins
    image: beverage-ledger-jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    # On Docker Desktop the mounted socket belongs to root inside the container
    # and the `jenkins` user cannot write to it. Aligning GIDs instead is not
    # portable between Windows and Linux hosts, and this is a local CI sandbox.
    user: root
    ports:
      - '8080:8080'
      # Inbound agents. Unused today, kept because adding an agent later
      # otherwise means recreating the container.
      - '50000:50000'
    volumes:
      - jenkins_home:/var/jenkins_home
      # The pipeline builds and runs containers on the host's daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devops-net

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - devops-net

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  devops-net:
    external: true
